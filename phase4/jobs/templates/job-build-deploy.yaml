# Manual Cloud Build. One Cloud Run job. No push trigger. Do not tag latest.
# Build image sha-<7>, deploy that digest to Pre-Prod. Does not write preprod-approved.
#
# Substitutions:
#   _JOB_ID            catalog id (dropdown)
#   _TARGET_PROJECT    sujho-preprod (this file must not target Prod)
#   _ENTRY_ID          optional; required at execute time for ingest/remove
#   _COMMIT_SHA        full git SHA from GitHub github.sha (not trigger COMMIT_SHA)
#   _SHORT_SHA         first 7 of _COMMIT_SHA
#   _DC_CONNECTION     Developer Connect connection
#
# gcloud builds submit --no-source does not set COMMIT_SHA / SHORT_SHA.
# The GitHub form must pass _COMMIT_SHA and _SHORT_SHA.

dependencies:
  - gitSource:
      repository:
        developerConnect: projects/${PROJECT_ID}/locations/asia-south1/connections/${_DC_CONNECTION}/gitRepositoryLinks/sujho-sujho
      revision: ${_COMMIT_SHA}
      depth: 1
      destPath: .

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _JOB_ID: knowledge-store-sessions
  _TARGET_PROJECT: sujho-preprod
  _ENTRY_ID: ""
  _COMMIT_SHA: ""
  _SHORT_SHA: ""
  _REGION: asia-south1
  _REGISTRY: asia-south1-docker.pkg.dev/sujho-dev/services
  _DC_CONNECTION: sujho-github-dc

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    id: lookup
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_COMMIT_SHA}" ] || [ -z "${_SHORT_SHA}" ]; then
          echo "Refuse: _COMMIT_SHA/_SHORT_SHA empty. Pass them from GitHub github.sha."
          exit 1
        fi
        python3 jobs/scripts/lookup_job.py --id "${_JOB_ID}" > /workspace/job.env
        cat /workspace/job.env
        # shellcheck disable=SC1091
        source /workspace/job.env
        if [ "${_TARGET_PROJECT}" = "sujho-478914" ]; then
          echo "Refuse: build-and-deploy must not target Prod. Use deploy-only."
          exit 1
        fi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    id: checkout-pins
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # shellcheck disable=SC1091
        source /workspace/job.env
        python3 ci/checkout-gitlinks.py --paths $$GITLINKS
    waitFor: [lookup]

  - name: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    id: build-and-push
    args:
      - --dockerfile=knowledge_store/Dockerfile
      - --context=dir://.
      - --destination=${_REGISTRY}/knowledge-store-jobs:sha-${_SHORT_SHA}
      - --digest-file=/workspace/job.digest
      - --cache=true
      - --cache-ttl=168h
    waitFor: [checkout-pins]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # shellcheck disable=SC1091
        source /workspace/job.env
        DIGEST=$$(cat /workspace/job.digest)
        IMAGE_REF="${_REGISTRY}/$${IMAGE}@$${DIGEST}"
        SA="$${RUNTIME_SA}@${_TARGET_PROJECT}.iam.gserviceaccount.com"
        echo "Deploying $$CLOUD_RUN_JOB image $$IMAGE_REF"
        gcloud run jobs deploy "$$CLOUD_RUN_JOB" \
          --project="${_TARGET_PROJECT}" \
          --region="${_REGION}" \
          --image="$$IMAGE_REF" \
          --service-account="$$SA" \
          --command="$$COMMAND" \
          --args="$$ARGS" \
          --tasks="$$TASKS" \
          --parallelism="$$PARALLELISM" \
          --max-retries="$$MAX_RETRIES" \
          --cpu="$$CPU" \
          --memory="$$MEMORY" \
          --task-timeout="$$TASK_TIMEOUT" \
          --update-env-vars="GOOGLE_CLOUD_PROJECT=${_TARGET_PROJECT},GOOGLE_CLOUD_LOCATION=${_REGION},RELEASE_COMMIT_SHA=${_COMMIT_SHA},RELEASE_IMAGE_DIGEST=$$DIGEST" \
          --quiet
        gcloud run jobs describe "$$CLOUD_RUN_JOB" \
          --project="${_TARGET_PROJECT}" \
          --region="${_REGION}" \
          --format='value(metadata.name)' | grep -qx "$$CLOUD_RUN_JOB"
    waitFor: [build-and-push]

timeout: 900s
