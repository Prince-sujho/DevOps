# Manual Cloud Build. One Cloud Run job. No image build.
# Resolve preprod-approved and deploy that digest to _TARGET_PROJECT
# (Prod from the Prod GitHub form). Prod must match Pre-Prod digest.
#
# gcloud builds submit --no-source does not set COMMIT_SHA.
# The GitHub form must pass _COMMIT_SHA so gitSource can check out job.json.

dependencies:
  - gitSource:
      repository:
        developerConnect: projects/${PROJECT_ID}/locations/asia-south1/connections/${_DC_CONNECTION}/gitRepositoryLinks/sujho-sujho
      revision: ${_COMMIT_SHA}
      depth: 1
      destPath: .

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _JOB_ID: knowledge-store-sessions
  _TARGET_PROJECT: sujho-478914
  _COMMIT_SHA: ""
  _SHORT_SHA: ""
  _IMAGE_DIGEST: ""
  _REGION: asia-south1
  _REGISTRY: asia-south1-docker.pkg.dev/sujho-dev/services
  _DC_CONNECTION: sujho-github-dc

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    id: lookup
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_COMMIT_SHA}" ]; then
          echo "Refuse: _COMMIT_SHA empty. Pass it from GitHub github.sha."
          exit 1
        fi
        python3 jobs/scripts/lookup_job.py --id "${_JOB_ID}" > /workspace/job.env
        cat /workspace/job.env
        # shellcheck disable=SC1091
        source /workspace/job.env
        if [ -z "${_IMAGE_DIGEST}" ]; then
          echo "Refuse: pass _IMAGE_DIGEST (do not resolve a moving tag at deploy time)."
          exit 1
        fi
        SHORT="${_SHORT_SHA}"
        if [ -z "$$SHORT" ]; then
          SHORT=$$(printf '%s' "${_COMMIT_SHA}" | cut -c1-7)
        fi
        SHA_DIGEST=$$(gcloud artifacts docker images describe \
          "${_REGISTRY}/$${IMAGE}:sha-$$SHORT" \
          --format='value(image_summary.digest)')
        TAG_DIGEST=$$(gcloud artifacts docker images describe \
          "${_REGISTRY}/$${IMAGE}:preprod-approved" \
          --format='value(image_summary.digest)')
        if [ -z "$$SHA_DIGEST" ] || [ -z "$$TAG_DIGEST" ]; then
          echo "Refuse: missing sha-$$SHORT or preprod-approved for $${IMAGE}"
          exit 1
        fi
        if [ "${_IMAGE_DIGEST}" != "$$SHA_DIGEST" ] || [ "$$SHA_DIGEST" != "$$TAG_DIGEST" ]; then
          echo "Refuse: digest mismatch (tag moved or wrong commit). passed=${_IMAGE_DIGEST} sha=$$SHA_DIGEST tag=$$TAG_DIGEST"
          exit 1
        fi
        echo "PINNED_DIGEST=${_IMAGE_DIGEST}" >> /workspace/job.env

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # shellcheck disable=SC1091
        source /workspace/job.env
        DIGEST="${_IMAGE_DIGEST}"
        IMAGE_REF="${_REGISTRY}/$${IMAGE}@$${DIGEST}"
        SA="$${RUNTIME_SA}@${_TARGET_PROJECT}.iam.gserviceaccount.com"
        echo "Deploy-only $$CLOUD_RUN_JOB $$IMAGE_REF"
        gcloud run jobs deploy "$$CLOUD_RUN_JOB" \
          --project="${_TARGET_PROJECT}" \
          --region="${_REGION}" \
          --image="$$IMAGE_REF" \
          --service-account="$$SA" \
          --command="$$COMMAND" \
          --args="$$ARGS" \
          --tasks="$$TASKS" \
          --parallelism="$$PARALLELISM" \
          --max-retries="$$MAX_RETRIES" \
          --cpu="$$CPU" \
          --memory="$$MEMORY" \
          --task-timeout="$$TASK_TIMEOUT" \
          --update-env-vars="GOOGLE_CLOUD_PROJECT=${_TARGET_PROJECT},GOOGLE_CLOUD_LOCATION=${_REGION},RELEASE_IMAGE_DIGEST=$$DIGEST" \
          --quiet
    waitFor: [lookup]

timeout: 600s
