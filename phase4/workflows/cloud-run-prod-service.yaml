name: Deploy Cloud Run service (Prod)

# Manual only. Merge to main does not run this.
# Opening this file IS choosing the environment. Service dropdown only.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service (one per run)
        required: true
        type: choice
        default: redirect
        options:
          - redirect
          - text
          - users
          - whatsapp
          - document-worker
          - admin
      commit:
        description: Git commit to deploy (empty = this run's github.sha). Prod must be the commit tested on Pre-Prod.
        required: false
        type: string
        default: ""

concurrency:
  group: cloudrun-sujho-478914-${{ inputs.service }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless this run is on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Refuse: dispatch from main, not ${{ github.ref }}"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit || github.sha }}

      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_PROD }}

      - uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: Start Cloud Build for this service
        env:
          SERVICE: ${{ inputs.service }}
          BUILD_PROJECT: sujho-478914
          TARGET_PROJECT: sujho-478914
          REGISTRY: asia-south1-docker.pkg.dev/sujho-dev/services
          PIN_DIGEST: "1"
          SHA: ${{ inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' "$SHA" | cut -c1-7)"
          case "$SERVICE" in
            redirect) IMAGE=redirect ;;
            text) IMAGE=text ;;
            users) IMAGE=users ;;
            whatsapp) IMAGE=whatsapp ;;
            document-worker) IMAGE=document-worker ;;
            admin) IMAGE=admin ;;
            *) echo "unknown service $SERVICE"; exit 1 ;;
          esac
          extra=""
          if [ "$PIN_DIGEST" = "1" ]; then
            DIGEST="$(gcloud artifacts docker images describe \
              "$REGISTRY/$IMAGE:sha-$SHORT" --format='value(image_summary.digest)')"
            APPROVED="$(gcloud artifacts docker images describe \
              "$REGISTRY/$IMAGE:preprod-approved" --format='value(image_summary.digest)')"
            if [ -z "$DIGEST" ] || [ "$DIGEST" != "$APPROVED" ]; then
              echo "Refuse: sha-$SHORT is not preprod-approved (TOCTOU / not stamped)."
              exit 1
            fi
            extra=",_IMAGE_DIGEST=$DIGEST"
          fi
          gcloud builds submit --no-source \
            --project="$BUILD_PROJECT" \
            --region=asia-south1 \
            --config="ci/${SERVICE}-deploy-only.yaml" \
            --substitutions=_TARGET_PROJECT="$TARGET_PROJECT",_COMMIT_SHA="$SHA",_SHORT_SHA="$SHORT"$extra
