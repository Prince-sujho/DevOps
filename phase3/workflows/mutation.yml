name: Weekly mutation

# Not a merge gate, reports only. Hours-long mutmut times out and bills per
# minute on GitHub-hosted runners, so this only runs on the self-hosted one.
# Scope is tests/ci/pipeline.py mutation — a score drop flags the tracking
# issue, the job still exits green.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mutation:
    name: mutation
    runs-on: [self-hosted, mutation]
    timeout-minutes: 720
    steps:
      # Post-phase0: sujho has no submodules to recurse into (the 8 backend
      # repos are plain subdirectories now, not gitlinks).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install test + mutmut dependencies
        run: python tests/ci/pipeline.py install-mutation

      - name: mutmut run
        id: mutmut
        continue-on-error: true
        run: python tests/ci/pipeline.py mutation

      # A crashed mutmut run must be visible, not just an absent report:
      # the annotation shows on the run summary, and mutation_report.py
      # records "no report" as flag_review for the tracking issue.
      - name: Say so if mutmut itself failed
        if: steps.mutmut.outcome == 'failure'
        run: echo "::warning title=mutmut run failed::see the mutmut run step log"

      - name: Report (never fails the job)
        run: python3 scripts/mutation_report.py --report mutants/mutmut-cicd-stats.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-result
          path: |
            mutation-result.json
            mutants/mutmut-report.html
            mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore

      - name: Post on the tracking issue
        if: always() && vars.MUTATION_TRACKING_ISSUE != ''
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('mutation-result.json')) return;
            const r = JSON.parse(fs.readFileSync('mutation-result.json', 'utf8'));
            const n = Number(process.env.ISSUE);
            if (!n) return;
            let body = `<!-- phase3-mutation -->\n### Weekly mutation (${context.repo.repo})\n\n`;
            if (r.skipped) body += `Skipped: ${r.reason}\n`;
            else {
              body += `Score ${r.score} (killed ${r.killed}/${r.total}, `;
              body += `survivors ${r.survivors}). Baseline ${r.baseline}. ${r.reason}\n`;
            }
            if (r.flag_review) body += `\nNeeds a human look — not a CI failure.\n`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: n, body,
            });
        env:
          ISSUE: ${{ vars.MUTATION_TRACKING_ISSUE }}
