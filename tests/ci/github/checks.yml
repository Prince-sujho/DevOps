name: checks

# Ordered fast -> slow so a cheap failure (lint) is reported in seconds,
# not after paying for the full test matrix. Stages live in
# tests/ci/pipeline.py; this workflow only supplies GitHub-specific setup.
# See tests/outcomes/FINDINGS.md (Static analysis section) for the
# integration-suite tradeoff explained below.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install root + per-submodule requirements
        run: python tests/ci/pipeline.py install

      - name: Blocking pipeline (static, secrets, unit, api, eval-checks, gates, coverage)
        run: python tests/ci/pipeline.py static secrets unit api eval-checks gates coverage

      # Integration and e2e tests exercise a real Firestore emulator, which
      # needs `gcloud` (present on GitHub-hosted runners) plus a real JRE
      # (Java 8+) for `gcloud emulators firestore start`. This step is
      # marked best-effort (continue-on-error) rather than removed, so CI
      # visibly runs it and reports failures without blocking merges on an
      # environment dependency we haven't hardened yet. See
      # tests/outcomes/FINDINGS.md (Static analysis section)
      # "Integration/e2e CI tradeoff" for the reasoning and the follow-up
      # (pin a JRE setup step, e.g. actions/setup-java, and re-promote this
      # to blocking once it's been green for a while).
      - name: Set up JRE for Firestore emulator (integration/e2e, best-effort)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
        continue-on-error: true

      - name: "integration tests (best-effort: needs Firestore emulator + JRE)"
        continue-on-error: true
        run: python tests/ci/pipeline.py integration

      - name: "e2e tests (best-effort: needs Firestore emulator + JRE)"
        continue-on-error: true
        run: python tests/ci/pipeline.py e2e

      - name: diff coverage gate (changed lines only)
        if: github.event_name == 'pull_request'
        run: |
          # New/changed lines must clear a materially higher bar (95%) than
          # the 90% global floor: the global number is inherited debt on
          # existing code, but new code should not add to it. See
          # tests/outcomes/UNCERTAINTY.md (Static analysis section) for why
          # 95% (not 100%) was chosen.
          python tests/ci/pipeline.py diff-cover --base-branch origin/${{ github.base_ref }}
