name: Deploy Cloud Run job (Prod)

# Manual only. Deploys the exact image already tested on Pre-Prod, never rebuilds.
# Same environment: production gate as cloud-run-prod-service.yaml.

on:
  workflow_dispatch:
    inputs:
      job:
        description: Cloud Run job (one per run)
        required: true
        type: choice
        default: knowledge-store-sessions
        options:
          - knowledge-store-sessions
          - knowledge-store-ingest
          - knowledge-store-remove
          - knowledge-store-import-ncert
          - knowledge-store-import-educart
      commit:
        description: Git commit to deploy — the one tested on Pre-Prod. Typed once.
        required: true
        type: string
      entry_id:
        description: Required to execute ingest/remove. Ignored for other jobs.
        required: false
        type: string
        default: ""
      execute:
        description: Run the job once after a successful deploy
        type: boolean
        default: false

concurrency:
  group: cloudrun-job-sujho-478914-${{ inputs.job }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless this run is on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Refuse: dispatch from main, not ${{ github.ref }}"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Refuse unless the typed commit is an ancestor of main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ inputs.commit }}" origin/main; then
            echo "Refuse: ${{ inputs.commit }} is not on main."
            exit 1
          fi

      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_PROD }}

      - uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: Refuse unless the tested image actually exists
        env:
          JOB_ID: ${{ inputs.job }}
          SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' "$SHA" | cut -c1-7)"
          eval "$(python3 jobs/scripts/lookup_job.py --id "$JOB_ID")"
          REGISTRY="asia-south1-docker.pkg.dev/sujho-preprod/services"
          DIGEST="$(gcloud artifacts docker images describe \
            "$REGISTRY/$IMAGE:sha-$SHORT" --format='value(image_summary.digest)' || true)"
          if [ -z "$DIGEST" ]; then
            echo "Refuse: $REGISTRY/$IMAGE:sha-$SHORT does not exist. Nothing was tested to promote."
            exit 1
          fi

  # paused until a Lead approves on the production Environment
  deploy:
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}

      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_PROD }}

      - uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: Start Cloud Build — deploy only, no rebuild
        env:
          JOB_ID: ${{ inputs.job }}
          SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' "$SHA" | cut -c1-7)"
          eval "$(python3 jobs/scripts/lookup_job.py --id "$JOB_ID")"

          gcloud builds submit --no-source \
            --project=sujho-478914 \
            --region=asia-south1 \
            --config=ci/job-deploy-only.yaml \
            --substitutions=\
_JOB_ID="$JOB_ID",\
_IMAGE="$IMAGE",\
_RUNTIME_SA="$RUNTIME_SA",\
_CPU="$CPU",\
_MEMORY="$MEMORY",\
_TASK_TIMEOUT="$TASK_TIMEOUT",\
_TASKS="$TASKS",\
_PARALLELISM="$PARALLELISM",\
_MAX_RETRIES="$MAX_RETRIES",\
_SCHEDULE="$SCHEDULE",\
_COMMIT_SHA="$SHA",\
_SHORT_SHA="$SHORT"

      - name: Execute job once
        if: ${{ inputs.execute }}
        env:
          JOB_ID: ${{ inputs.job }}
          ENTRY_ID: ${{ inputs.entry_id }}
        run: |
          set -euo pipefail
          eval "$(python3 jobs/scripts/lookup_job.py --id "$JOB_ID")"
          if [ "$NEEDS_ENTRY_ID" = "1" ]; then
            if [ -z "$ENTRY_ID" ]; then
              echo "this job needs entry_id to execute"
              exit 1
            fi
            gcloud run jobs execute "$JOB_ID" \
              --project=sujho-478914 --region=asia-south1 \
              --update-args="$ENTRY_ID" --wait
          else
            gcloud run jobs execute "$JOB_ID" \
              --project=sujho-478914 --region=asia-south1 --wait
          fi
