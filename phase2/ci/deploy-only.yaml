# Prod recipe. No build, no tests, never fetches service source — deploys
# the exact image already tested in Pre-Prod. Image stays in sujho-preprod's
# warehouse; Prod only reads it. sujho-478914 has no Developer Connect link
# (design: it never fetches from GitHub) — the calling workflow already has
# the exact tested commit checked out and uploads it as real source, so this
# workspace starts populated, not empty. Needs that checkout only so the
# verify step below can run its own gate script.

substitutions:
  _SERVICE_NAME: ""
  _CPU: "1"
  _MEMORY: "512Mi"
  _TIMEOUT: "240s"
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "10"
  # extra gcloud run deploy flags from services.json run_args. Never a flag
  # that decides who may call the service: those set the service's IAM
  # policy, which needs run.admin, and the builder only has run.developer.
  # Public access is a one-time Lead decision (IAM-table.md 3d), not
  # something a deploy re-decides on every release.
  _RUN_ARGS: ""
  # runtime identity the container acts as; the deploy refuses without one, so
  # nothing ever silently runs as the project's default compute account
  _RUNTIME_SA: ""
  # ';'-separated, converted to ',' below: this whole substitutions string is
  # comma-separated, so a comma inside one value would start a new substitution
  _SECRETS: ""
  _ENV_VARS: ""
  _VERIFY_METHOD: "health"
  _TARGET_PROJECT: "sujho-478914"
  _REGISTRY: "asia-south1-docker.pkg.dev/sujho-preprod/services"
  _COMMIT_SHA: ""
  _SHORT_SHA: ""
  _REGION: "asia-south1"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # resolve the digest behind sha-<commit>, never trust a moving tag
  - id: resolve-digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DIGEST="$(gcloud artifacts docker images describe \
          "${_REGISTRY}/${_SERVICE_NAME}:sha-${_SHORT_SHA}" \
          --format='value(image_summary.digest)')"
        if [ -z "$$DIGEST" ]; then
          echo "Refuse: ${_REGISTRY}/${_SERVICE_NAME}:sha-${_SHORT_SHA}" \
            "does not exist. Nothing was tested to promote."
          exit 1
        fi
        echo "$$DIGEST" > /workspace/.digest
        echo "Deploying digest $$DIGEST (sha-${_SHORT_SHA})"

  - id: deploy-no-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DIGEST="$(cat /workspace/.digest)"
        if [ -z "${_RUNTIME_SA}" ]; then
          echo "Refuse: no runtime_sa for ${_SERVICE_NAME} in ci/services.json."
          echo "Without it the container runs as the default compute account,"
          echo "which is far broader than any one service needs."
          exit 1
        fi
        # --update-*, never --set-*/--clear-*: an incomplete list in
        # services.json must not strip config the service already has.
        ENV_ARG="RELEASE_COMMIT_SHA=${_COMMIT_SHA},RELEASE_IMAGE_DIGEST=$${DIGEST}"
        EXTRA_ENV="$(printf '%s' "${_ENV_VARS}" | tr ';' ',')"
        if [ -n "$$EXTRA_ENV" ]; then
          ENV_ARG="$${ENV_ARG},$${EXTRA_ENV}"
        fi
        ARGS=(
          --project="${_TARGET_PROJECT}"
          --region="${_REGION}"
          --image="${_REGISTRY}/${_SERVICE_NAME}@$${DIGEST}"
          --no-traffic
          --tag="build-${_SHORT_SHA}"
          --cpu="${_CPU}"
          --memory="${_MEMORY}"
          --timeout="${_TIMEOUT}"
          --min-instances="${_MIN_INSTANCES}"
          --max-instances="${_MAX_INSTANCES}"
          --service-account="${_RUNTIME_SA}@${_TARGET_PROJECT}.iam.gserviceaccount.com"
          --update-env-vars="$${ENV_ARG}"
        )
        if [ -n "${_SECRETS}" ]; then
          ARGS+=(--update-secrets="$(printf '%s' "${_SECRETS}" | tr ';' ',')")
        fi
        gcloud run deploy "${_SERVICE_NAME}" "$${ARGS[@]}" ${_RUN_ARGS}
    waitFor: ["resolve-digest"]

  # polls up to 15x so a slow start doesn't fail the check
  - id: verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # --expect-digest is the part that can actually fail: it reads the
        # image the revision is running and compares it against the digest
        # this same build produced (Pre-Prod) or resolved (Prod). The commit
        # sha is a self-consistency check on top of that, not proof on its own.
        python3 ci/gates/verify_revision.py \
          --service="${_SERVICE_NAME}" --project="${_TARGET_PROJECT}" \
          --region="${_REGION}" --tag="build-${_SHORT_SHA}" \
          --expect-sha="${_COMMIT_SHA}" \
          --expect-digest="$(cat /workspace/.digest)" \
          --method="${_VERIFY_METHOD}" \
          --attempts=15
    waitFor: ["deploy-no-traffic"]

  - id: shift-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        tag_revision() {
          python3 ci/gates/verify_revision.py --print-revision --allow-missing \
            --service="${_SERVICE_NAME}" --project="${_TARGET_PROJECT}" \
            --region="${_REGION}" --tag="$$1"
        }
        traffic() {
          gcloud run services update-traffic "${_SERVICE_NAME}" \
            --project="${_TARGET_PROJECT}" --region="${_REGION}" "$$@"
        }
        # the revision verify just checked, by its tag -- not --to-latest and
        # not status.traffic[0], which can be an old 0% tagged entry
        REVISION="$(tag_revision "build-${_SHORT_SHA}")"
        # Whatever is known-good right now becomes the rollback target.
        # A Cloud Run revision's labels are fixed when it is created, and
        # gcloud has no command to change them later, so "this revision took
        # traffic and passed" is recorded as a traffic tag on the service,
        # which is editable: lkg = serving now, prev = the one before it.
        PREVIOUS_GOOD="$(tag_revision lkg)"
        # One call. Traffic, prev, lkg and dropping the build tag are a single
        # service update, so a build that dies cannot leave traffic on the new
        # revision while prev still names the one before the good one.
        TAGS="lkg=$$REVISION"
        if [ -n "$$PREVIOUS_GOOD" ] && [ "$$PREVIOUS_GOOD" != "$$REVISION" ]; then
          TAGS="prev=$$PREVIOUS_GOOD,$$TAGS"
        fi
        traffic \
          --to-revisions="$$REVISION=100" \
          --update-tags="$$TAGS" \
          --remove-tags="build-${_SHORT_SHA}"
        echo "traffic on $$REVISION (lkg); rollback target $${PREVIOUS_GOOD:-none yet}"
    waitFor: ["verify"]

timeout: 900s
