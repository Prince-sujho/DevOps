# Shared Pre-Prod recipe for every job. Values come from lookup_job.py,
# resolved by the calling workflow, same as services.json for the service recipe.
# Submitted with --no-source, so the workspace starts empty — fetch-sujho fills it.

substitutions:
  _JOB_ID: ""
  _DOCKERFILE: ""
  _IMAGE: ""
  _GITLINKS: ""
  _RUNTIME_SA: ""
  _CPU: "1"
  _MEMORY: "512Mi"
  _TASK_TIMEOUT: "3600s"
  _TASKS: "1"
  _PARALLELISM: "1"
  _MAX_RETRIES: "0"
  _ENTRY_FILE: ""
  _ENTRY_MODULE: ""
  _SCHEDULE: ""
  _COMMIT_SHA: ""
  _SHORT_SHA: ""
  _TARGET_PROJECT: "sujho-preprod"
  _REGISTRY: "asia-south1-docker.pkg.dev/sujho-preprod/services"
  _REGION: "asia-south1"
  _DC_CONNECTION: "sujho-github-dc-org"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # inline, self-contained: nothing from this repo exists in the workspace
  # yet, so this can't call a script that lives inside it (circular)
  - id: fetch-sujho
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URI="$(gcloud developer-connect git-repository-links describe sujho-sujho \
          --location="${_REGION}" --connection="${_DC_CONNECTION}" --project="${_TARGET_PROJECT}" \
          --format='value(cloneUri)')"
        [ -n "$URI" ] || { echo "refuse: sujho-sujho Developer Connect link not found"; exit 1; }
        git init .
        git remote add origin "$URI"
        git fetch --depth=1 origin "${_COMMIT_SHA}"
        git checkout --force "${_COMMIT_SHA}"

  - id: fetch-gitlinks
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python3 ci/checkout-gitlinks.py --root=. --paths $_GITLINKS \
          --project="${_TARGET_PROJECT}" --region="${_REGION}" --connection="${_DC_CONNECTION}"
    waitFor: ["fetch-sujho"]

  # renamed/missing entry file fails here, not at run time with "module not found"
  - id: check-entry-file-exists
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ ! -f "${_ENTRY_FILE}" ]; then
          echo "Refuse: no such job entry point at ${_ENTRY_FILE} (derived from ${_JOB_ID})"
          exit 1
        fi
        echo "ok: ${_ENTRY_FILE} exists, runs as python -m ${_ENTRY_MODULE}"
    waitFor: ["fetch-gitlinks"]

  # same baselining rule as the service recipe — against what's currently
  # deployed, not a PR merge-base
  - id: resolve-baseline
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BASE_SHA="$(python3 ci/gates/resolve_baseline.py --kind=jobs \
          --name="${_JOB_ID}" --project="${_TARGET_PROJECT}" --region="${_REGION}")"
        if [ -z "$BASE_SHA" ]; then
          echo "no prior deploy for ${_JOB_ID}, first deploy"
          BASE_SHA="${_COMMIT_SHA}"
        fi
        echo "$BASE_SHA" > /workspace/.baseline_sha
        echo "baseline commit: $BASE_SHA"
    waitFor: ["fetch-sujho"]

  # needs git for the mypy worktree diff, semgrep's --baseline-commit, and
  # `git ls-files` (detect-secrets-hook's file list)
  - id: gate-1-static
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        pip install --quiet ruff mypy semgrep detect-secrets
        ruff check .
        python3 ci/gates/mypy_ratchet.py --baseline-sha "$(cat /workspace/.baseline_sha)"
        semgrep scan --config=auto --error --baseline-commit "$(cat /workspace/.baseline_sha)"
        detect-secrets-hook --baseline tests/ci/.secrets.baseline $(git ls-files)
    waitFor: ["check-entry-file-exists", "resolve-baseline"]

  # knowledge_store has zero tests today (tracked gap, priority 2) — no
  # invariant suite to run here yet. Not silently skipped: this step exists
  # so the gap is visible in the pipeline, not just in someone's memory.
  - id: gate-2-invariants
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        echo "no invariant tests exist for this job's package yet — known gap, not run"
    waitFor: ["gate-1-static"]

  - id: gate-3-guardrails
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python3 tests/tooling/check_assertions.py
        python3 tests/tooling/check_test_count.py
    waitFor: ["gate-2-invariants"]

  - id: build-image
    name: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=${_DOCKERFILE}
      - --context=dir:///workspace
      - --destination=${_REGISTRY}/${_IMAGE}:sha-${_SHORT_SHA}
      - --cache=true
      - --cache-ttl=168h
    waitFor: ["gate-3-guardrails"]

  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run jobs deploy "${_JOB_ID}" \
          --project="${_TARGET_PROJECT}" --region="${_REGION}" \
          --image="${_REGISTRY}/${_IMAGE}:sha-${_SHORT_SHA}" \
          --command=python3 --args="-m,${_ENTRY_MODULE}" \
          --cpu="${_CPU}" --memory="${_MEMORY}" --task-timeout="${_TASK_TIMEOUT}" \
          --tasks="${_TASKS}" --parallelism="${_PARALLELISM}" --max-retries="${_MAX_RETRIES}" \
          --service-account="${_RUNTIME_SA}@${_TARGET_PROJECT}.iam.gserviceaccount.com" \
          --update-env-vars="RELEASE_COMMIT_SHA=${_COMMIT_SHA}"
        echo "deployed ${_JOB_ID}, not executed"
    waitFor: ["build-image"]

  # no-op if the job has no schedule field — run-by-hand only
  - id: sync-schedule
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_SCHEDULE}" ]; then
          echo "no schedule for ${_JOB_ID} — run-by-hand only"
          exit 0
        fi
        SCHED_NAME="${_JOB_ID}-schedule"
        SA="scheduler-invoker@${_TARGET_PROJECT}.iam.gserviceaccount.com"
        URI="https://${_REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${_TARGET_PROJECT}/jobs/${_JOB_ID}:run"
        if gcloud scheduler jobs describe "$SCHED_NAME" --project="${_TARGET_PROJECT}" --location="${_REGION}" >/dev/null 2>&1; then
          gcloud scheduler jobs update http "$SCHED_NAME" \
            --project="${_TARGET_PROJECT}" --location="${_REGION}" \
            --schedule="${_SCHEDULE}" --uri="$URI" --http-method=POST \
            --oauth-service-account-email="$SA"
        else
          gcloud scheduler jobs create http "$SCHED_NAME" \
            --project="${_TARGET_PROJECT}" --location="${_REGION}" \
            --schedule="${_SCHEDULE}" --uri="$URI" --http-method=POST \
            --oauth-service-account-email="$SA"
        fi
        echo "scheduler entry ${SCHED_NAME}: ${_SCHEDULE}"
    waitFor: ["deploy-job"]

timeout: 3600s
