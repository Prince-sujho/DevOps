# Shared Pre-Prod recipe for every service. Values come from ci/services.json.
# Runs in sujho-preprod only. Order: gates -> build -> no-traffic deploy -> verify -> shift traffic.
# Submitted with --no-source, so the workspace starts empty — fetch-sujho is what fills it.

substitutions:
  _SERVICE_NAME: ""
  _DOCKERFILE: ""
  _PRE_BUILD_DIR: ""
  _CPU: "1"
  _MEMORY: "512Mi"
  _TIMEOUT: "240s"
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "10"
  _RUN_ARGS: "--allow-unauthenticated"
  _VERIFY_METHOD: "health"
  _TARGET_PROJECT: "sujho-preprod"
  _REGISTRY: "asia-south1-docker.pkg.dev/sujho-preprod/services"
  _COMMIT_SHA: ""
  _SHORT_SHA: ""
  _REGION: "asia-south1"
  _DC_CONNECTION: "sujho-github-dc-org"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # inline, self-contained: nothing from this repo exists in the workspace
  # yet, so this can't call a script that lives inside it (circular)
  - id: fetch-sujho
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URI="$(gcloud developer-connect git-repository-links describe sujho-sujho \
          --location="${_REGION}" --connection="${_DC_CONNECTION}" --project="${_TARGET_PROJECT}" \
          --format='value(cloneUri)')"
        [ -n "$URI" ] || { echo "refuse: sujho-sujho Developer Connect link not found"; exit 1; }
        git init .
        git remote add origin "$URI"
        git fetch --depth=1 origin "${_COMMIT_SHA}"
        git checkout --force "${_COMMIT_SHA}"

  # baseline for semgrep/mypy = whatever's live now, read off the revision's
  # own env var, not an unverified annotation value
  - id: resolve-baseline
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BASE_SHA="$(python3 ci/gates/resolve_baseline.py --kind=services \
          --name="${_SERVICE_NAME}" --project="${_TARGET_PROJECT}" --region="${_REGION}")"
        if [ -z "$BASE_SHA" ]; then
          echo "no prior revision for ${_SERVICE_NAME}, first deploy"
          BASE_SHA="${_COMMIT_SHA}"
        fi
        # Decision 14: semgrep and mypy compare against the deployed commit.
        # fetch-sujho fetched only the deploy SHA at depth 1; semgrep's baseline
        # runs `git diff --merge-base`, which needs the history joining the two.
        # Full history of this small repo, fetched here where the Developer
        # Connect credentials are. If the baseline isn't there, fail the build.
        if [ "$BASE_SHA" != "${_COMMIT_SHA}" ]; then
          git fetch --unshallow origin
        fi
        git cat-file -e "$BASE_SHA^{commit}"
        echo "$BASE_SHA" > /workspace/.baseline_sha
        echo "baseline commit: $BASE_SHA"
        # The mypy ratchet must count the same tree on both sides: the baseline
        # commit's own worktree, just as HEAD has it. Built on a volume, not in
        # /workspace, so ruff/mypy/semgrep on HEAD never scan it.
        git worktree add --detach /baseline "$BASE_SHA"
    volumes:
      - name: baseline
        path: /baseline
    waitFor: ["fetch-sujho"]

  # gate 1: static — ruff, mypy ratchet, semgrep, secrets. Needs git for
  # semgrep's --baseline-commit and detect-secrets' file list; python:3.12-slim has none.
  - id: gate-1-static
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git >/dev/null
        pip install --quiet ruff mypy semgrep detect-secrets
        ruff check .
        python3 ci/gates/mypy_ratchet.py \
          --baseline-sha "$(cat /workspace/.baseline_sha)" \
          --baseline-root /baseline
        semgrep scan --config=auto --error --baseline-commit "$(cat /workspace/.baseline_sha)"
        detect-secrets-hook --baseline tests/ci/.secrets.baseline $(git ls-files)
    volumes:
      - name: baseline
        path: /baseline
    waitFor: ["fetch-sujho", "resolve-baseline"]

  # gate 2: the 65 kept tests, plus knowledge_store's 9 pure-logic additions,
  # against a Firestore emulator. tests/knowledge_store's other 10 tests (real
  # Neo4j via Docker) are verified locally -- 10/10 pass, see
  # tests/knowledge_store/requirements-test.txt -- but not run here: this step
  # has no Docker daemon reachable, and none of Cloud Build's plain containers
  # do by default. Wiring that in is separate work (a docker-enabled step or
  # self-hosted worker), not done yet.
  #
  # Three separate pytest invocations, not one. tests/integration/conftest.py
  # and tests/e2e/conftest.py each start their OWN independent Firestore
  # emulator subprocess and each stamp `FIRESTORE_EMULATOR_HOST` themselves --
  # running both suites in a single pytest process races the two emulators
  # against each other's env var and breaks pytest-asyncio's fixture-scope
  # resolution (tests/e2e has no pytest.ini of its own; a combined invocation
  # picks up only one config for both suites). unit/api need no emulator at
  # all. Confirmed by running it the other way first: it produced real,
  # intermittent errors in test_cross_service_contract.py.
  - id: gate-2-invariants
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq default-jre-headless curl >/dev/null
        # Skips host-side Python compilation during the SDK install; documented
        # speedup for CI/containers, no effect on the emulator itself.
        export CLOUDSDK_SKIP_PY_COMPILATION=1
        curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts >/dev/null
        # Installed once; tests/integration and tests/e2e each invoke this
        # binary themselves, on their own port, when their own fixture runs.
        gcloud components install cloud-firestore-emulator --quiet
        # each app imports its own deps at import time (dotenv, segno, ...)
        pip install --quiet -e ./infra -r tests/requirements.txt \
          $(for f in */requirements.txt */app/requirements.txt; do \
            [ -f "$f" ] && printf -- "-r %s " "$f"; \
          done)

        pytest -q \
          tests/api/user_service/test_auth_boundary.py \
          tests/api/whatsapp_adapter/test_webhook_signature.py \
          tests/api/text_agent/test_auth_boundary.py \
          tests/api/document_worker/test_auth_boundary.py \
          tests/unit/whatsapp_adapter/test_flow_crypto.py \
          tests/unit/infra/test_leases.py \
          tests/unit/infra/test_pricing.py \
          tests/unit/infra/test_catalog_job_args.py \
          tests/unit/user_service/test_gifting.py \
          tests/unit/user_service/test_influencers.py \
          tests/unit/user_service/test_user_id.py \
          tests/unit/knowledge_store/test_graph_ids.py \
          tests/unit/knowledge_store/test_embedder_batches.py

        pytest -q tests/integration

        pytest -q tests/e2e/test_idempotency.py tests/e2e/test_webhook_signature.py
    waitFor: ["gate-1-static"]

  # gate 3: suite guardrails — assertions real, count hasn't dropped.
  # check_test_count runs `pytest --collect-only`, which imports every suite:
  # a fresh container needs pytest and every app's deps, same as gate 2.
  - id: gate-3-guardrails
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet -e ./infra -r tests/requirements.txt \
          $(for f in */requirements.txt */app/requirements.txt; do \
            [ -f "$f" ] && printf -- "-r %s " "$f"; \
          done)
        python3 tests/tooling/check_assertions.py
        python3 tests/tooling/check_test_count.py
    waitFor: ["gate-2-invariants"]

  - id: pre-build
    name: gcr.io/cloud-builders/npm
    entrypoint: bash
    args:
      - -c
      - |
        if [ -n "${_PRE_BUILD_DIR}" ]; then
          cd "${_PRE_BUILD_DIR}" && npm ci && npm run build
        fi
    waitFor: ["gate-3-guardrails"]

  - id: build-image
    name: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=${_DOCKERFILE}
      - --context=dir:///workspace
      - --destination=${_REGISTRY}/${_SERVICE_NAME}:sha-${_SHORT_SHA}
      - --cache=true
      - --cache-ttl=168h
    waitFor: ["pre-build"]

  - id: deploy-no-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy "${_SERVICE_NAME}" \
          --project="${_TARGET_PROJECT}" --region="${_REGION}" \
          --image="${_REGISTRY}/${_SERVICE_NAME}:sha-${_SHORT_SHA}" \
          --no-traffic --tag="build-${_SHORT_SHA}" \
          --cpu="${_CPU}" --memory="${_MEMORY}" --timeout="${_TIMEOUT}" \
          --min-instances="${_MIN_INSTANCES}" --max-instances="${_MAX_INSTANCES}" \
          --update-env-vars="RELEASE_COMMIT_SHA=${_COMMIT_SHA},RELEASE_IMAGE_DIGEST=pending" \
          ${_RUN_ARGS}
    waitFor: ["build-image"]

  # polls up to 15x so a slow-starting container doesn't fail the check
  - id: verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python3 ci/gates/verify_revision.py \
          --service="${_SERVICE_NAME}" --project="${_TARGET_PROJECT}" \
          --region="${_REGION}" --tag="build-${_SHORT_SHA}" \
          --expect-sha="${_COMMIT_SHA}" --method="${_VERIFY_METHOD}" \
          --attempts=15
    waitFor: ["deploy-no-traffic"]

  - id: shift-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # the revision verify just checked, by its tag -- not --to-latest and
        # not status.traffic[0], which can be an old 0% tagged entry
        REVISION="$(python3 ci/gates/verify_revision.py --print-revision \
          --service="${_SERVICE_NAME}" --project="${_TARGET_PROJECT}" \
          --region="${_REGION}" --tag="build-${_SHORT_SHA}")"
        gcloud run services update-traffic "${_SERVICE_NAME}" \
          --project="${_TARGET_PROJECT}" --region="${_REGION}" \
          --to-revisions="$REVISION=100"
        gcloud run revisions update "$REVISION" \
          --project="${_TARGET_PROJECT}" --region="${_REGION}" \
          --update-labels=served=true
        echo "traffic on $REVISION, served=true"
    waitFor: ["verify"]

timeout: 3600s
