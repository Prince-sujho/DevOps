# Prod recipe for jobs. No build, no gates — deploys the image already
# tested in Pre-Prod. Prod only ever reads the sujho-preprod warehouse.

substitutions:
  _JOB_ID: ""
  _IMAGE: ""
  _RUNTIME_SA: ""
  _ENTRY_MODULE: ""
  # ';'-separated container args after the module (the verb). Empty for probe.
  _ENTRY_ARGS: ""
  _CPU: "1"
  _MEMORY: "512Mi"
  _TASK_TIMEOUT: "3600s"
  _TASKS: "1"
  _PARALLELISM: "1"
  _MAX_RETRIES: "0"
  _SCHEDULE: ""
  _COMMIT_SHA: ""
  _SHORT_SHA: ""
  _TARGET_PROJECT: "sujho-478914"
  _REGISTRY: "asia-south1-docker.pkg.dev/sujho-preprod/services"
  _REGION: "asia-south1"
  # ';'-separated, converted to ',' below, same as services.json's env
  _ENV_VARS: ""

serviceAccount: projects/sujho-478914/serviceAccounts/prod-builder@sujho-478914.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: resolve-digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DIGEST="$(gcloud artifacts docker images describe \
          "${_REGISTRY}/${_IMAGE}:sha-${_SHORT_SHA}" \
          --format='value(image_summary.digest)')"
        if [ -z "$$DIGEST" ]; then
          echo "Refuse: ${_REGISTRY}/${_IMAGE}:sha-${_SHORT_SHA}" \
            "does not exist. Nothing was tested to promote."
          exit 1
        fi
        echo "$$DIGEST" > /workspace/.digest

  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DIGEST="$(cat /workspace/.digest)"
        ENV_ARG="RELEASE_COMMIT_SHA=${_COMMIT_SHA},GOOGLE_CLOUD_PROJECT=${_TARGET_PROJECT},GOOGLE_CLOUD_LOCATION=${_REGION}"
        EXTRA_ENV="$(printf '%s' "${_ENV_VARS}" | tr ';' ',')"
        if [ -n "$$EXTRA_ENV" ]; then
          ENV_ARG="$${ENV_ARG},$${EXTRA_ENV}"
        fi
        ENTRY_ARGS="$(printf '%s' "${_ENTRY_ARGS}" | tr ';' ',')"
        RUN_ARGS="-m,${_ENTRY_MODULE}"
        if [ -n "$$ENTRY_ARGS" ]; then
          RUN_ARGS="$${RUN_ARGS},$${ENTRY_ARGS}"
        fi
        gcloud run jobs deploy "${_JOB_ID}" \
          --project="${_TARGET_PROJECT}" --region="${_REGION}" \
          --image="${_REGISTRY}/${_IMAGE}@$${DIGEST}" \
          --command=python3 --args="$${RUN_ARGS}" \
          --cpu="${_CPU}" --memory="${_MEMORY}" --task-timeout="${_TASK_TIMEOUT}" \
          --tasks="${_TASKS}" --parallelism="${_PARALLELISM}" --max-retries="${_MAX_RETRIES}" \
          --service-account="${_RUNTIME_SA}@${_TARGET_PROJECT}.iam.gserviceaccount.com" \
          --update-env-vars="$${ENV_ARG}"
        echo "deployed ${_JOB_ID} to Prod, not executed"
    waitFor: ["resolve-digest"]

  - id: sync-schedule
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:5f165a095e127672d76863f139547c6c3fda20fc152a02cf8b0d1195a6017be2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_SCHEDULE}" ]; then
          echo "no schedule for ${_JOB_ID} — run-by-hand only"
          exit 0
        fi
        SCHED_NAME="${_JOB_ID}-schedule"
        SA="scheduler-invoker@${_TARGET_PROJECT}.iam.gserviceaccount.com"
        BASE="https://${_REGION}-run.googleapis.com/apis/run.googleapis.com/v1"
        URI="$${BASE}/namespaces/${_TARGET_PROJECT}/jobs/${_JOB_ID}:run"
        if gcloud scheduler jobs describe "$$SCHED_NAME" \
          --project="${_TARGET_PROJECT}" --location="${_REGION}" \
          >/dev/null 2>&1; then
          gcloud scheduler jobs update http "$$SCHED_NAME" \
            --project="${_TARGET_PROJECT}" --location="${_REGION}" \
            --schedule="${_SCHEDULE}" --uri="$$URI" --http-method=POST \
            --oauth-service-account-email="$$SA"
        else
          gcloud scheduler jobs create http "$$SCHED_NAME" \
            --project="${_TARGET_PROJECT}" --location="${_REGION}" \
            --schedule="${_SCHEDULE}" --uri="$$URI" --http-method=POST \
            --oauth-service-account-email="$$SA"
        fi
        echo "scheduler entry $${SCHED_NAME}: ${_SCHEDULE}"
    waitFor: ["deploy-job"]

timeout: 900s
