name: Rollback Cloud Run service (Prod)

# Manual only. Shifts traffic to a previous revision — no rebuild. Afterwards
# the `lkg` tag moves onto the revision rolled to and `prev` is dropped, so a
# later rollback can never land back on the revision this one fled.
# Empty revision = whatever the service's own `prev` tag records as the last
# known good revision before the current deploy.
#
# `environment: production-rollback` — a Lead must be the one who runs it:
# Google only accepts a production-rollback run that a Lead started, and GCP
# trusts only that OIDC subject for the prod rollback account
# (repo:Sujho/platform:environment:production-rollback). There is no approval
# pause, so in an incident the Lead who starts the rollback is the whole
# gate; it is still a named, logged Lead action and nobody else can do it.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service (one per run)
        required: true
        type: choice
        default: redirect
        options:
          - redirect
          - text
          - users
          - whatsapp
          - document-worker
          - admin
          - probe
      revision:
        description: Cloud Run revision name (empty = previous serving)
        required: false
        type: string
        default: ""

concurrency:
  group: cloudrun-sujho-478914-${{ inputs.service }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    environment: production-rollback
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless this run is on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refuse: dispatch from main, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_PROD_ROLLBACK }}

      - uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: Shift traffic to previous revision
        env:
          PROJECT: sujho-478914
          SERVICE: ${{ inputs.service }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$REVISION" ]; then
            extra=(--revision="$REVISION")
          fi
          bash scripts/rollback-cloudrun.sh \
            --project="$PROJECT" --service="$SERVICE" --apply "${extra[@]}"
