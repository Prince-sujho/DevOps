name: Deploy Cloud Run service (Pre-Prod)

# Manual only. Merge to main does not run this.
# Runs entirely inside sujho-preprod. sujho-dev is never touched by this file.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service (one per run)
        required: true
        type: choice
        default: redirect
        options:
          - redirect
          - text
          - users
          - whatsapp
          - document-worker
          - admin
      commit:
        description: Git commit to deploy (empty = tip of main)
        required: false
        type: string
        default: ""

concurrency:
  group: cloudrun-sujho-preprod-${{ inputs.service }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Refuse unless this run is on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Refuse: dispatch from main, not ${{ github.ref }}"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve commit and refuse unless it's an ancestor of main
        id: resolve
        run: |
          set -euo pipefail
          SHA="${{ inputs.commit }}"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse origin/main)"
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Refuse: $SHA is not on main. Nothing unreviewed deploys from here."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_PREPROD }}

      - uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: Start Cloud Build
        env:
          SERVICE: ${{ inputs.service }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' "$SHA" | cut -c1-7)"
          CFG="$(jq -r --arg s "$SERVICE" '.[$s]' ci/services.json)"
          if [ "$CFG" = "null" ]; then
            echo "Refuse: $SERVICE is not in ci/services.json"
            exit 1
          fi
          RUN_ARGS="$(echo "$CFG" | jq -r '.run_args | join(" ")')"

          gcloud builds submit --no-source \
            --project=sujho-preprod \
            --region=asia-south1 \
            --config=ci/build-deploy.yaml \
            --substitutions=\
_SERVICE_NAME="$SERVICE",\
_DOCKERFILE=$(echo "$CFG" | jq -r .dockerfile),\
_GITLINKS=$(echo "$CFG" | jq -r '.gitlinks | join(" ")'),\
_PRE_BUILD_DIR=$(echo "$CFG" | jq -r '.pre_build_dir // ""'),\
_CPU=$(echo "$CFG" | jq -r '.cpu // "1"'),\
_MEMORY=$(echo "$CFG" | jq -r '.memory // "512Mi"'),\
_TIMEOUT=$(echo "$CFG" | jq -r '.timeout // "240s"'),\
_MIN_INSTANCES=$(echo "$CFG" | jq -r '.min_instances // "1"'),\
_MAX_INSTANCES=$(echo "$CFG" | jq -r '.max_instances // "10"'),\
_VERIFY_METHOD=$(echo "$CFG" | jq -r '.verify // "health"'),\
_RUN_ARGS="$RUN_ARGS",\
_COMMIT_SHA="$SHA",\
_SHORT_SHA="$SHORT"
