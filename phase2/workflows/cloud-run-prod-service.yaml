name: Deploy Cloud Run service (Prod)

# Manual only. Deploys the exact image already tested on Pre-Prod, never rebuilds.
# The deploy job's `environment: production` pauses for a Lead's approval —
# set that Environment's "Prevent self-review" so the starter can't approve their own run.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service (one per run)
        required: true
        type: choice
        default: redirect
        options:
          - redirect
          - text
          - users
          - whatsapp
          - document-worker
          - admin
      commit:
        description: Git commit to deploy — the one tested on Pre-Prod. Typed once.
        required: true
        type: string

concurrency:
  group: cloudrun-sujho-478914-${{ inputs.service }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless this run is on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Refuse: dispatch from main, not ${{ github.ref }}"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Refuse unless the typed commit is an ancestor of main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ inputs.commit }}" origin/main; then
            echo "Refuse: ${{ inputs.commit }} is not on main."
            exit 1
          fi

      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_PROD }}

      - uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: Refuse unless the tested image actually exists
        env:
          SERVICE: ${{ inputs.service }}
          SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' "$SHA" | cut -c1-7)"
          REGISTRY="asia-south1-docker.pkg.dev/sujho-preprod/services"
          DIGEST="$(gcloud artifacts docker images describe \
            "$REGISTRY/$SERVICE:sha-$SHORT" --format='value(image_summary.digest)' || true)"
          if [ -z "$DIGEST" ]; then
            echo "Refuse: $REGISTRY/$SERVICE:sha-$SHORT does not exist. Nothing was tested to promote."
            exit 1
          fi

  # paused until a Lead approves on the production Environment
  deploy:
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}

      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_PROD }}

      - uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: Start Cloud Build — deploy only, no rebuild
        env:
          SERVICE: ${{ inputs.service }}
          SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' "$SHA" | cut -c1-7)"
          CFG="$(jq -r --arg s "$SERVICE" '.[$s]' ci/services.json)"
          RUN_ARGS="$(echo "$CFG" | jq -r '.run_args | join(" ")')"

          gcloud builds submit --no-source \
            --project=sujho-478914 \
            --region=asia-south1 \
            --config=ci/deploy-only.yaml \
            --substitutions=\
_SERVICE_NAME="$SERVICE",\
_CPU=$(echo "$CFG" | jq -r '.cpu // "1"'),\
_MEMORY=$(echo "$CFG" | jq -r '.memory // "512Mi"'),\
_TIMEOUT=$(echo "$CFG" | jq -r '.timeout // "240s"'),\
_MIN_INSTANCES=$(echo "$CFG" | jq -r '.min_instances // "1"'),\
_MAX_INSTANCES=$(echo "$CFG" | jq -r '.max_instances // "10"'),\
_VERIFY_METHOD=$(echo "$CFG" | jq -r '.verify // "health"'),\
_RUN_ARGS="$RUN_ARGS",\
_COMMIT_SHA="$SHA",\
_SHORT_SHA="$SHORT"
