name: PR checks

# admin is Node. Do not run the Python workflow on this repo.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            code:
              - '**/*.{js,jsx,ts,tsx}'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'yarn.lock'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint
        run: |
          if npm run | grep -q '^  lint'; then
            npm run lint
          else
            echo "::warning::No npm lint script — skipping lint until one exists."
          fi

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Test
        run: |
          set +e
          npm test
          code=$?
          if [ $code -eq 1 ] && ! npm run | grep -q '^  test'; then
            echo "::warning::No npm test script — passing with a warning per Phase 2."
            exit 0
          fi
          exit $code

  pr-checks:
    name: pr-checks
    needs: [changes, lint, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          set -euo pipefail
          code="${{ needs.changes.outputs.code }}"
          lint="${{ needs.lint.result }}"
          tests="${{ needs.unit-tests.result }}"
          changes="${{ needs.changes.result }}"
          if [ "$changes" != "success" ]; then
            echo "changes job failed"; exit 1
          fi
          if [ "$code" != "true" ]; then
            echo "non-code PR — lint/tests skipped, gate green"
            exit 0
          fi
          if [ "$lint" != "success" ] || [ "$tests" != "success" ]; then
            echo "lint=$lint tests=$tests"
            exit 1
          fi
