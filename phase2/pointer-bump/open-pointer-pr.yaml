# Goes into every service repo's .github/workflows/. Set _SERVICE_PATH per repo,
# everything else stays identical. See README.md in this folder for the why.

name: Open pointer-bump PR on Sujho/sujho

on:
  push:
    branches: [main]

concurrency:
  group: pointer-bump-${{ github.repository }}
  cancel-in-progress: false

env:
  # gitlink path this repo occupies in Sujho/sujho, e.g. redirect_service
  _SERVICE_PATH: "CHANGE_ME"

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sujho/sujho
          token: ${{ secrets.SUJHO_POINTER_BUMP_TOKEN }}
          submodules: false

      - name: Move the one pointer to this merge's commit
        env:
          NEW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.SUJHO_POINTER_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "sujho-pointer-bump"
          git config user.email "pointer-bump@sujho.local"

          BRANCH="pointer-bump/${_SERVICE_PATH}-${NEW_SHA:0:7}"
          git checkout -b "$BRANCH"

          # gitlink is a tree entry, not a file — update-index, not an edit
          git update-index --add --cacheinfo 160000,"$NEW_SHA","$_SERVICE_PATH"
          git commit -m "Point ${_SERVICE_PATH} at ${NEW_SHA:0:7}"
          git push origin "$BRANCH"

          gh pr create \
            --repo Sujho/sujho \
            --base main \
            --head "$BRANCH" \
            --title "Point ${_SERVICE_PATH} at ${NEW_SHA:0:7}" \
            --body "Automatic pointer bump. One repo, one merge, one pointer. Nothing deploys from this merge alone — see phase2."
